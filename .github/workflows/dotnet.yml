
name: RaceDayAPI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDayAPI.sln

      - name: Build solution
        run: dotnet build RaceDayAPI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDayAPI.sln --configuration Release --no-build --verbosity normal
